:root{
  --bg:#0a0a0a;
  --surface:#121216;
  --surface2:#191920;
  --line:rgba(255,255,255,.12);
  --text:#f8fafc;
  --muted:#a8a8b8;
  --pink:#ec4899;
  --blue:#3b82f6;
  --aqua:#06b6d4;
  --green:#22c55e;
  --card:rgba(255,255,255,.055);
  --cardline:rgba(255,255,255,.11);
}

[data-theme="light"]{
  --bg:#f4f4f8;
  --surface:#ffffff;
  --surface2:#eceef5;
  --line:rgba(15,15,25,.12);
  --text:#10101a;
  --muted:#5b5f72;
  --card:rgba(255,255,255,.82);
  --cardline:rgba(15,15,25,.1);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Sora',system-ui,sans-serif;
  overflow-x:clip
}

a{
  color:inherit
}

button{
  font-family:inherit
}

.mono{
  font-family:'JetBrains Mono',monospace
}

.glass{
  background:var(--card);
  border:1px solid var(--cardline);
  backdrop-filter:blur(16px);
  box-shadow:0 20px 50px rgba(0,0,0,.22)
}

.grad{
  background:linear-gradient(90deg,#ec4899,#3b82f6,#06b6d4,#22c55e,#ec4899);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:grad 6s linear infinite
}

@keyframes grad{
  to{
    background-position:300% 0
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) scale(1)
  }

  50%{
    transform:translateY(-22px) scale(1.08)
  }
}

@keyframes blob{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  33%{
    transform:translate(28px,-30px) scale(1.15)
  }

  66%{
    transform:translate(-22px,18px) scale(.92)
  }
}

@keyframes rise{
  0%{
    transform:translateY(20vh) translateX(0) scale(.5);
    opacity:0
  }

  10%{
    opacity:.9
  }

  100%{
    transform:translateY(-110vh) translateX(30px) scale(1.1);
    opacity:0
  }
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(2.1);
    opacity:.35
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:0
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes marquee{
  to{
    transform:translateX(-50%)
  }
}

.blob{
  position:absolute;
  border-radius:9999px;
  filter:blur(70px);
  opacity:.55;
  animation:blob 11s ease-in-out infinite;
  pointer-events:none
}

.particle{
  position:fixed;
  bottom:-20px;
  border-radius:9999px;
  pointer-events:none;
  animation:rise linear infinite;
  z-index:1
}

.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .7s ease,transform .7s ease
}

.reveal.visible{
  opacity:1;
  transform:none
}

.chip{
  border:1px solid var(--cardline);
  border-radius:999px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  background:rgba(255,255,255,.05)
}

.btn{
  border-radius:999px;
  padding:13px 20px;
  font-weight:800;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.2s;
  border:1px solid transparent
}

.btn:active{
  transform:scale(.97)
}

.btn-pink{
  background:linear-gradient(90deg,#ec4899,#8b5cf6);
  color:white;
  box-shadow:0 12px 30px rgba(236,72,153,.35)
}

.btn-ghost{
  border-color:var(--cardline);
  background:rgba(255,255,255,.05)
}

.input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--cardline);
  border-radius:14px;
  padding:12px 14px;
  color:var(--text);
  outline:none
}

.input:focus{
  border-color:#ec4899;
  box-shadow:0 0 0 3px rgba(236,72,153,.18)
}

.tab{
  padding:10px 14px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  border:1px solid transparent
}

.tab.active{
  background:var(--text);
  color:var(--bg)
}

.clock-hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:50% 100%;
  will-change:transform;
  border-radius:99px
}

#aig-sec{
  transition:transform 0.05s linear
}

.bulb{
  transition:.25s
}

.fish{
  animation:floaty 3.4s ease-in-out infinite
}

.fish2{
  animation:floaty 4.2s ease-in-out infinite reverse
}

.marquee-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:marquee 22s linear infinite
}

::-webkit-scrollbar{
  width:9px
}

::-webkit-scrollbar-thumb{
  background:linear-gradient(#ec4899,#3b82f6);
  border-radius:99px
}

::-moz-selection{
  background:#ec4899;
  color:white
}

::selection{
  background:#ec4899;
  color:white
}

@media(max-width:640px){
  .btn{
    padding:12px 15px
  }
}

.proj-card{
  animation:projIn .35s ease both
}

@keyframes projIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(8px)
  }

  to{
    opacity:1;
    transform:none
  }
}

.chat-pop{
  animation:projIn .25s ease both;
  transform-origin:bottom right
}

.radio-knob{
  width:44px;
  height:44px;
  border-radius:9999px;
  background:radial-gradient(circle at 35% 30%,#fff,#9ca3af 45%,#3f3f46 75%,#111);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 -3px 6px rgba(0,0,0,.5);
  position:relative
}

.radio-knob:after{
  content:"";
  position:absolute;
  left:50%;
  top:5px;
  width:3px;
  height:14px;
  background:#111;
  border-radius:99px;
  transform:translateX(-50%)
}

.radio-chrome{
  width:52px;
  height:52px;
  border-radius:9999px;
  display:grid;
  place-items:center;
  color:#111;
  font-weight:900;
  background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 45%,#64748b 75%,#27272a);
  box-shadow:0 4px 14px rgba(0,0,0,.6), inset 0 -3px 6px rgba(0,0,0,.35);
  transition:.15s
}

.radio-chrome:active{
  transform:scale(.94)
}

.radio-mini{
  width:36px;
  height:36px;
  border-radius:9999px;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:900;
  color:#111;
  background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 55%,#64748b);
  flex-shrink:0
}

.radio-range{
  accent-color:#22ff44;
  cursor:pointer
}

.radio-screen-on{
  animation:screenGlow 1.8s ease-in-out infinite
}

@keyframes screenGlow{
  0%,100%{
    box-shadow:inset 0 0 30px rgba(0,0,0,.7), 0 0 18px rgba(34,255,68,.25)
  }

  50%{
    box-shadow:inset 0 0 30px rgba(0,0,0,.7), 0 0 34px rgba(34,255,68,.5)
  }
}

/* TINA RETRO — portrait par défaut, paysage en 2 colonnes */

.tina-shell{
  background:repeating-linear-gradient(90deg,#061a3f 0 22px,#071f4a 22px 44px);
  border:3px solid var(--tina-accent,#2563eb);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 0 34px rgba(37,99,235,.35)
}

.tina-inner{
  max-width:580px
}

.tina-grid{
  display:grid;
  grid-template-columns:1fr
}

@media (orientation:landscape) and (min-width:900px){
  .tina-shell{
    overflow-x:auto
  }

  .tina-inner{
    max-width:1180px
  }

  .tina-grid{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:start
  }
}

.tina-knob{
  --tina-angle:0deg;
  width:62px;
  height:62px;
  border-radius:9999px;
  position:relative;
  background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 42%,#64748b 72%,#27272a);
  box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.4);
  outline:none
}

.tina-knob:focus-visible{
  box-shadow:0 0 0 3px var(--tina-accent,#2563eb)
}

.tina-knob-mark{
  position:absolute;
  left:50%;
  top:6px;
  width:4px;
  height:18px;
  border-radius:99px;
  background:#ef4444;
  transform:translateX(-50%) rotate(var(--tina-angle));
  transform-origin:50% 25px
}

.tina-tube{
  width:44px;
  height:62px;
  border-radius:9999px 9999px 12px 12px;
  background:linear-gradient(180deg,#2a2118,#120e08);
  border:1px solid #4a3a1a;
  position:relative;
  overflow:hidden
}

.tina-tube-core{
  position:absolute;
  left:50%;
  bottom:6px;
  width:16px;
  height:34px;
  transform:translateX(-50%);
  border-radius:9999px;
  background:#3a2a12;
  transition:.3s
}

.tina-tube-on{
  box-shadow:0 0 22px rgba(251,146,60,.9),0 0 44px rgba(251,146,60,.45)
}

.tina-tube-on .tina-tube-core{
  background:linear-gradient(180deg,#fde68a,#f97316);
  box-shadow:0 0 18px #fb923c;
  animation:tubeGlow 1.4s ease-in-out infinite
}

@keyframes tubeGlow{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.75
  }
}

.tina-transport{
  min-width:52px;
  height:48px;
  padding:0 10px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900;
  color:#111;
  background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 45%,#64748b 75%,#27272a);
  box-shadow:0 3px 10px rgba(0,0,0,.5)

.tina-transport:active{
